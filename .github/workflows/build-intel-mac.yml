name: Build macOS Intel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-intel:
    # macos-latest (Apple Silicon ARM) is always available; macos-13 (Intel)
    # is scarce and can queue for hours on the free plan.
    # Problem: lance-linalg build.rs compiles its AVX-512 kernel with
    # -march=native. On ARM host + --target x86_64-apple-darwin, clang treats
    # native as ARM → silent C compile failure → missing symbol at link time.
    # Fix: CC wrapper that replaces -march=native with explicit x86_64 AVX-512
    # flags so the kernel compiles correctly in cross-compile.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Install protoc
        run: brew install protobuf

      # The committed libpdfium.dylib is arm64-only; swap in the
      # official x86_64 build so PDF extraction works on Intel.
      - name: Use x86_64 pdfium binary
        run: |
          curl -L -o pdfium-mac-x64.tgz https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-mac-x64.tgz
          tar xzf pdfium-mac-x64.tgz lib/libpdfium.dylib
          cp lib/libpdfium.dylib src-tauri/pdfium/libpdfium.dylib
          file src-tauri/pdfium/libpdfium.dylib

      # lance-linalg build.rs passes -march=native to the C compiler when
      # building the AVX-512 dist_table kernel. On an ARM host cross-compiling
      # to x86_64, this flag is incoherent and clang fails silently, leaving
      # the AVX-512 symbol absent → linker error. This wrapper intercepts
      # -march=native and replaces it with explicit x86_64 AVX-512 flags.
      - name: Create CC wrapper for x86_64 cross-compile (fix -march=native)
        run: |
          cat > /usr/local/bin/cc-x86_64-wrapper << 'WRAPPER'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            if [[ "$arg" == "-march=native" ]]; then
              args+=("-march=x86-64" "-mavx512f" "-mavx512bw" "-mavx512vl" "-mavx512dq")
            else
              args+=("$arg")
            fi
          done
          exec clang "${args[@]}"
          WRAPPER
          chmod +x /usr/local/bin/cc-x86_64-wrapper

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app (x86_64)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CC_x86_64_apple_darwin: /usr/local/bin/cc-x86_64-wrapper
        with:
          args: '--target x86_64-apple-darwin'

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLM-Wiki-macOS-Intel-dmg
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
